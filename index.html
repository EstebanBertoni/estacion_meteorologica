<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estación Meteorológica - Tiempo Real</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Estación Meteorológica</h1>

        <div class="status-badge">
            <span id="dot" class="status-dot"></span>
            <span id="status-text">Desconectado</span>
        </div>
    </header>


    <main>

        <div class="grid">

            <!-- Temperatura DHT22 -->
            <div class="card">
                <span class="card-title">Temp. DHT22</span>

                <div class="card-value">
                    <span id="t_dht">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>


            <!-- Humedad -->
            <div class="card">
                <span class="card-title">Humedad</span>

                <div class="card-value">
                    <span id="humedad">--</span>
                    <span class="unit">%</span>
                </div>
            </div>


            <!-- Temperatura BMP280 -->
            <div class="card">
                <span class="card-title">Temp. BMP280</span>

                <div class="card-value">
                    <span id="t_bmp">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>


            <!-- Presión -->
            <div class="card">
                <span class="card-title">Presión Atmosférica</span>

                <div class="card-value">
                    <span id="presion">--</span>
                    <span class="unit">hPa</span>
                </div>
            </div>


            <!-- RSSI -->
            <div class="card">
                <span class="card-title">Señal Wi-Fi (ESP32)</span>

                <div class="card-value">
                    <span id="rssi">--</span>
                    <span class="unit">dBm</span>
                </div>
            </div>


            <!-- Altitud -->
            <div class="card">
                <span class="card-title">Altitud</span>

                <div class="card-value">
                    <span id="altitud">--</span>
                    <span class="unit">m</span>
                </div>
            </div>


            <!-- Punto de rocío -->
            <div class="card">
                <span class="card-title">Punto de Rocío</span>

                <div class="card-value">
                    <span id="punto_rocio">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>


            <!-- Sensación térmica -->
            <div class="card">
                <span class="card-title">Sensación Térmica</span>

                <div class="card-value">
                    <span id="sensacion_termica">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>

        </div>

    </main>


    <footer>

        Última actualización:
        <span id="last-update">Sin datos</span>

    </footer>


    <script>

        /*
        ============================================================
        CONFIGURACIÓN WEBSOCKET
        ============================================================
        */

        // Detecta automáticamente si estamos usando HTTP o HTTPS.
        // Si la página utiliza HTTP -> ws://
        // Si la página utiliza HTTPS -> wss://

        const protocol =
            window.location.protocol === "https:"
                ? "wss:"
                : "ws:";

        const WS_URL =
            `${protocol}//${window.location.host}/ws/clima`;


        let ws = null;

        let reconnectTimer = null;


        /*
        ============================================================
        ELEMENTOS DEL DOM
        ============================================================
        */

        const dot =
            document.getElementById("dot");

        const statusText =
            document.getElementById("status-text");

        const lastUpdate =
            document.getElementById("last-update");


        const tDht =
            document.getElementById("t_dht");

        const humedad =
            document.getElementById("humedad");

        const tBmp =
            document.getElementById("t_bmp");

        const presion =
            document.getElementById("presion");

        const rssi =
            document.getElementById("rssi");

        const altitud =
            document.getElementById("altitud");

        const puntoRocio =
            document.getElementById("punto_rocio");

        const sensacionTermica =
            document.getElementById("sensacion_termica");


        /*
        ============================================================
        FUNCIÓN DE FORMATEO
        ============================================================
        */

        function formatNumber(value, decimals = 1) {

            const number = Number(value);

            if (!Number.isFinite(number)) {
                return "--";
            }

            return number.toFixed(decimals);
        }


        /*
        ============================================================
        ACTUALIZACIÓN DE LA INTERFAZ
        ============================================================
        */

        function updateInterface(data) {

            console.log(
                "[INTERFAZ] Actualizando datos:",
                data
            );


            // Temperatura DHT22

            if (data.t_dht !== undefined) {

                tDht.textContent =
                    formatNumber(data.t_dht, 1);
            }


            // Humedad

            if (data.humedad !== undefined) {

                humedad.textContent =
                    formatNumber(data.humedad, 1);
            }


            // Temperatura BMP280

            if (data.t_bmp !== undefined) {

                tBmp.textContent =
                    formatNumber(data.t_bmp, 1);
            }


            // Presión atmosférica

            if (data.presion !== undefined) {

                presion.textContent =
                    formatNumber(data.presion, 1);
            }


            // RSSI

            if (data.rssi !== undefined) {

                rssi.textContent =
                    data.rssi;
            }


            // Altitud

            if (data.altitud !== undefined) {

                altitud.textContent =
                    formatNumber(data.altitud, 1);
            }


            // Punto de rocío

            if (data.punto_rocio !== undefined) {

                puntoRocio.textContent =
                    formatNumber(data.punto_rocio, 1);
            }


            // Sensación térmica

            if (data.sensacion_termica !== undefined) {

                sensacionTermica.textContent =
                    formatNumber(
                        data.sensacion_termica,
                        1
                    );
            }


            // Hora de última actualización

            lastUpdate.textContent =
                new Date().toLocaleTimeString(
                    "es-AR"
                );
        }


        /*
        ============================================================
        CONEXIÓN WEBSOCKET
        ============================================================
        */

        function connect() {

            // Evitar conexiones duplicadas

            if (
                ws &&
                (
                    ws.readyState === WebSocket.OPEN ||
                    ws.readyState === WebSocket.CONNECTING
                )
            ) {

                console.log(
                    "[WebSocket] Ya existe una conexión."
                );

                return;
            }


            console.log(
                "[WebSocket] Intentando conectar a:",
                WS_URL
            );


            statusText.textContent =
                "Conectando...";


            ws = new WebSocket(WS_URL);


            /*
            --------------------------------------------------------
            CONEXIÓN ABIERTA
            --------------------------------------------------------
            */

            ws.onopen = function () {

                console.log(
                    "[WebSocket] Conectado correctamente."
                );


                dot.classList.add("connected");

                statusText.textContent =
                    "En vivo";
            };


            /*
            --------------------------------------------------------
            MENSAJE RECIBIDO
            --------------------------------------------------------
            */

            ws.onmessage = function (event) {

                console.log(
                    "[WebSocket] Mensaje recibido:",
                    event.data
                );


                try {

                    const data =
                        JSON.parse(event.data);


                    console.log(
                        "[WebSocket] JSON procesado:",
                        data
                    );


                    updateInterface(data);

                }

                catch (error) {

                    console.error(
                        "[WebSocket] Error al procesar JSON:",
                        error
                    );
                }
            };


            /*
            --------------------------------------------------------
            CONEXIÓN CERRADA
            --------------------------------------------------------
            */

            ws.onclose = function (event) {

                console.warn(
                    "[WebSocket] Conexión cerrada.",
                    "Código:",
                    event.code,
                    "Razón:",
                    event.reason
                );


                dot.classList.remove(
                    "connected"
                );


                statusText.textContent =
                    "Reconectando...";


                scheduleReconnect();
            };


            /*
            --------------------------------------------------------
            ERROR
            --------------------------------------------------------
            */

            ws.onerror = function (error) {

                console.error(
                    "[WebSocket] Error:",
                    error
                );

                /*
                onclose normalmente será llamado
                posteriormente y se encargará de
                realizar la reconexión.
                */
            };
        }


        /*
        ============================================================
        RECONEXIÓN AUTOMÁTICA
        ============================================================
        */

        function scheduleReconnect() {

            if (reconnectTimer !== null) {
                return;
            }


            reconnectTimer =
                setTimeout(function () {

                    reconnectTimer = null;

                    connect();

                }, 3000);
        }


        /*
        ============================================================
        INICIO
        ============================================================
        */

        console.log(
            "======================================"
        );

        console.log(
            "ESTACIÓN METEOROLÓGICA IoT"
        );

        console.log(
            "WebSocket:",
            WS_URL
        );

        console.log(
            "======================================"
        );


        connect();

    </script>

</body>

</html>
